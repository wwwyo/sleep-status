version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    exclude-paths:
      # Pullfrog owns this workflow and delivers its action updates.
      - .github/workflows/pullfrog.yml
  # No Swift dependencies today; keep the policy ready for future additions.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
